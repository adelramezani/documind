# curl, not get_url — see nodejs role; urllib can't auth to the NTLM proxy.
- name: Download the Ollama archive (online)
  ansible.builtin.command:
    cmd: >-
      curl -fsSL --proxy-anyauth --retry 3 --retry-all-errors --max-time 600
      -o /tmp/ollama-linux-amd64.tgz
      https://ollama.com/download/ollama-linux-amd64.tgz
  when: deploy_mode == 'online'

- name: Install Ollama into ~/.local (bin/ollama, lib/ollama)
  ansible.builtin.unarchive:
    src: >-
      {{ '/tmp/ollama-linux-amd64.tgz' if deploy_mode == 'online'
         else stage_dir + '/ollama-linux-amd64.tgz' }}
    remote_src: true
    dest: "{{ user_local }}"
    creates: "{{ user_local }}/bin/ollama"

- name: Create the user systemd directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Install the Ollama user service
  ansible.builtin.template:
    src: ollama.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/ollama.service"
    mode: "0644"
  notify: Restart ollama

- name: Enable and start the Ollama user service
  ansible.builtin.systemd:
    name: ollama
    scope: user
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the Ollama API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 11434
    timeout: 30

- name: Install staged models (offline)
  ansible.builtin.copy:
    src: "{{ stage_dir }}/models/"
    dest: "{{ ollama_models_dir }}/"
  when: deploy_mode == 'offline'

- name: Pull required models (online)
  ansible.builtin.command: "{{ user_local }}/bin/ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  environment:
    OLLAMA_HOST: 127.0.0.1:11434
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
  register: ollama_pull
  changed_when: "'success' in ollama_pull.stdout"
  when: deploy_mode == 'online'
